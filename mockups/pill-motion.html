<title>Whisper Pill Motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #101012;
    --stage: #1a1719;
    --ink: #f2f0ee;
    --dim: rgba(242,240,238,.55);
    --faint: rgba(242,240,238,.14);
    --accent: #ef5b4a;
    --pill-black: #0a0a0a;
    color-scheme: dark;
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    padding-inline: 20px; padding-block: 28px 60px;
  }
  main { max-width: 1040px; margin-inline: auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; text-wrap: balance; }
  .lede { color: var(--dim); font-size: 14px; margin: 0 0 20px; max-width: 60ch; line-height: 1.5; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
  button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--ink);
    background: transparent; border: 1px solid var(--faint); border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
  }
  button:hover { border-color: rgba(242,240,238,.35); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .hint { color: var(--dim); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .opt { display: grid; grid-template-rows: auto 1fr auto; gap: 0; border: 1px solid var(--faint); border-radius: 12px; overflow: hidden; }
  .opt header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px 10px; }
  .opt h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .opt .tag { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; }
  .opt p { margin: 0; padding: 0 14px 12px; color: var(--dim); font-size: 13px; line-height: 1.45; }
  .stage {
    background: var(--stage); height: 150px; position: relative;
    display: flex; justify-content: center; align-items: flex-start; padding-top: 14px;
    background-image: radial-gradient(ellipse at 50% 120%, rgba(90,60,70,.35), transparent 60%);
  }
  .notch { position: absolute; top: 0; left: 50%; translate: -50% 0; width: 150px; height: 20px; background: #000; border-radius: 0 0 12px 12px; }
  .params {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; line-height: 1.6;
    color: var(--dim); padding: 10px 14px 12px; border-top: 1px solid var(--faint); white-space: pre; overflow-x: auto;
  }
  .params b { color: var(--ink); font-weight: 500; }

  /* The pill: idle capsule that grows into the three-button bar. Each option
     sets its own timing through custom properties on the wrapper. */
  .pill {
    position: relative; margin-top: 24px; box-sizing: border-box;
    width: 44px; height: 8px; border-radius: 999px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35);
    transition:
      width var(--cd) var(--ce), height var(--cd) var(--ce),
      background-color var(--cd) var(--ce), border-color var(--cd) var(--ce),
      transform var(--cd) var(--ce);
    cursor: default;
  }
  .pill.open {
    width: 116px; height: 38px; background: var(--pill-black); border-color: rgba(255,255,255,0);
    transition:
      width var(--od) var(--oe), height var(--od) var(--oe),
      background-color var(--od) var(--oe), border-color var(--od) var(--oe),
      transform var(--od) var(--oe);
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  .icons {
    position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 10px;
    opacity: 0; transform: scale(var(--is, 1));
    transition: opacity var(--icd) var(--ice) var(--icdelay-close), transform var(--icd) var(--ice) var(--icdelay-close);
  }
  .open .icons { opacity: 1; transform: scale(1); transition: opacity var(--iod) var(--ioe) var(--icdelay), transform var(--iod) var(--ioe) var(--icdelay); }
  .btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .btn:hover { background: rgba(255,255,255,.22); }
  .btn svg { width: 15px; height: 15px; display: block; }
  @media (prefers-reduced-motion: reduce) { .pill, .icons { transition-duration: 1ms !important; } }
</style>
<main>
  <h1>Whisper pill motion</h1>
  <p class="lede">Six ways the idle capsule can grow into the three-button bar and shrink back. Hover a pill to open it, move off to close it, or hit Loop to run them all in step. Numbers under each one are what would go into <code>morphTick</code>.</p>
  <div class="controls">
    <button id="loop" aria-pressed="false">Loop all</button>
    <button id="slow" aria-pressed="false">Half speed</button>
    <span class="hint">Current build is option A.</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<script>
  const OPTIONS = [
    { key: 'A', name: 'Current', blurb: 'Fast start, long settle on open. Balanced in-out on close. Icons ride in during the second half.',
      od: .40, oe: 'cubic-bezier(.25,1,.5,1)',   cd: .30, ce: 'cubic-bezier(.65,0,.35,1)',
      iod: .22, ioe: 'ease-out', icdelay: .16, icd: .10, ice: 'ease-in', icdelayClose: 0,
      note: 'open  0.40s ease-out quart\nclose 0.30s ease-in-out cubic\nicons fade in from 35% of the way' },
    { key: 'B', name: 'Snappy', blurb: 'Apple-menu quick. Barely any settle, so the bar feels like it was already there. Least floaty.',
      od: .24, oe: 'cubic-bezier(.2,.8,.2,1)',   cd: .20, ce: 'cubic-bezier(.4,0,.6,1)',
      iod: .14, ioe: 'ease-out', icdelay: .08, icd: .08, ice: 'ease-in', icdelayClose: 0,
      note: 'open  0.24s ease-out\nclose 0.20s ease-in-out\nicons fade in after 80ms' },
    { key: 'C', name: 'Spring', blurb: 'Overshoots the target by a hair and eases back, like a real spring. Close has no bounce so leaving feels calm.',
      od: .46, oe: 'cubic-bezier(.34,1.45,.64,1)', cd: .28, ce: 'cubic-bezier(.55,0,.3,1)',
      iod: .20, ioe: 'ease-out', icdelay: .18, icd: .10, ice: 'ease-in', icdelayClose: 0, is: .8,
      note: 'open  0.46s spring, ~4% overshoot\nclose 0.28s ease-in-out\nicons scale 0.8 to 1 with the fade' },
    { key: 'D', name: 'Glide', blurb: 'Slowest of the set. Long exponential tail on both directions, like a drawer on soft-close hinges.',
      od: .55, oe: 'cubic-bezier(.16,1,.3,1)',   cd: .42, ce: 'cubic-bezier(.7,0,.84,0)',
      iod: .30, ioe: 'ease-out', icdelay: .18, icd: .14, ice: 'ease-in', icdelayClose: 0,
      note: 'open  0.55s ease-out expo\nclose 0.42s ease-in expo\nicons fade over 0.30s' },
    { key: 'E', name: 'Shape then icons', blurb: 'The capsule finishes growing before any icon shows. Two clear beats: open, then reveal. Icons leave first on close.',
      od: .30, oe: 'cubic-bezier(.25,1,.5,1)',   cd: .26, ce: 'cubic-bezier(.65,0,.35,1)',
      iod: .18, ioe: 'ease-out', icdelay: .28, icd: .08, ice: 'ease-in', icdelayClose: 0, is: .9, closeIconsFirst: true,
      note: 'open  0.30s, icons start at 0.28s\nclose icons 0.08s, then shrink 0.26s\ntwo beats instead of one blend' },
    { key: 'F', name: 'Fade through', blurb: 'The capsule dims to black first, then grows. Reads as one object changing state rather than stretching.',
      od: .38, oe: 'cubic-bezier(.3,0,.2,1)',    cd: .30, ce: 'cubic-bezier(.4,0,.2,1)',
      iod: .20, ioe: 'ease-out', icdelay: .20, icd: .10, ice: 'ease-in', icdelayClose: 0, fadeFirst: true,
      note: 'color 0.14s, then size 0.38s\nclose 0.30s ease-in-out\nicons fade in near the end' },
  ];

  const ICONS = {
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    w: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="2.4" height="14" rx="1.2"/><rect x="7.4" y="11" width="2.4" height="8" rx="1.2"/><rect x="11.8" y="8" width="2.4" height="11" rx="1.2"/><rect x="16.2" y="11" width="2.4" height="8" rx="1.2"/><rect x="20.6" y="5" width="2.4" height="14" rx="1.2" transform="translate(-2 0)"/></svg>',
    expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
  };

  const grid = document.getElementById('grid');
  const pills = [];
  for (const o of OPTIONS) {
    const el = document.createElement('section');
    el.className = 'opt';
    el.style.setProperty('--od', o.od + 's'); el.style.setProperty('--oe', o.oe);
    el.style.setProperty('--cd', o.cd + 's'); el.style.setProperty('--ce', o.ce);
    el.style.setProperty('--iod', o.iod + 's'); el.style.setProperty('--ioe', o.ioe);
    el.style.setProperty('--icd', o.icd + 's'); el.style.setProperty('--ice', o.ice);
    el.style.setProperty('--icdelay', o.icdelay + 's');
    el.style.setProperty('--icdelay-close', (o.icdelayClose || 0) + 's');
    if (o.is) el.style.setProperty('--is', o.is);
    el.innerHTML = `
      <header><h2>${o.name}</h2><span class="tag">Option ${o.key}</span></header>
      <p>${o.blurb}</p>
      <div class="stage"><div class="notch"></div>
        <div class="pill" tabindex="0" aria-label="Option ${o.key} pill">
          <div class="icons">
            <span class="btn">${ICONS.gear}</span>
            <span class="btn">${ICONS.w}</span>
            <span class="btn">${ICONS.expand}</span>
          </div>
        </div>
      </div>
      <div class="params">${o.note.replace(/^(\S+)/gm, '<b>$1</b>')}</div>`;
    grid.appendChild(el);
    const pill = el.querySelector('.pill');
    pills.push({ pill, o, el });

    const open = () => setOpen(pill, o, true);
    const close = () => setOpen(pill, o, false);
    pill.addEventListener('pointerenter', open);
    pill.addEventListener('pointerleave', close);
    pill.addEventListener('focus', open);
    pill.addEventListener('blur', close);
  }

  function setOpen(pill, o, on) {
    if (on) {
      if (o.fadeFirst) {
        // Beat one: dim to black in place. Beat two: grow.
        pill.style.transition = 'background-color .14s ease-out, border-color .14s ease-out';
        pill.style.backgroundColor = '#0a0a0a';
        pill.style.borderColor = 'rgba(255,255,255,0)';
        setTimeout(() => { pill.style.transition = ''; pill.classList.add('open'); }, 120 * speed);
      } else {
        pill.classList.add('open');
      }
    } else {
      if (o.closeIconsFirst) {
        const icons = pill.querySelector('.icons');
        icons.style.opacity = 0;
        setTimeout(() => { icons.style.opacity = ''; pill.classList.remove('open'); pill.style.cssText = ''; }, o.icd * 1000 * speed);
      } else {
        pill.classList.remove('open');
        pill.style.cssText = '';
      }
    }
  }

  // Loop and half-speed controls.
  let loopTimer = null, speed = 1;
  const loopBtn = document.getElementById('loop');
  const slowBtn = document.getElementById('slow');
  loopBtn.addEventListener('click', () => {
    const on = loopBtn.getAttribute('aria-pressed') !== 'true';
    loopBtn.setAttribute('aria-pressed', on);
    clearInterval(loopTimer);
    if (!on) { pills.forEach(p => setOpen(p.pill, p.o, false)); return; }
    let state = false;
    const step = () => { state = !state; pills.forEach(p => setOpen(p.pill, p.o, state)); };
    step();
    loopTimer = setInterval(step, 1500 * speed);
  });
  slowBtn.addEventListener('click', () => {
    const on = slowBtn.getAttribute('aria-pressed') !== 'true';
    slowBtn.setAttribute('aria-pressed', on);
    speed = on ? 2 : 1;
    for (const { el, o } of pills) {
      el.style.setProperty('--od', o.od * speed + 's'); el.style.setProperty('--cd', o.cd * speed + 's');
      el.style.setProperty('--iod', o.iod * speed + 's'); el.style.setProperty('--icd', o.icd * speed + 's');
      el.style.setProperty('--icdelay', o.icdelay * speed + 's');
    }
    if (loopBtn.getAttribute('aria-pressed') === 'true') { loopBtn.click(); loopBtn.click(); }
  });
</script>
